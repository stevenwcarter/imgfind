[package]
name = "imgfind-launcher"
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Desktop launcher for imgfind: pick a library to open or index a new folder."
repository = "https://github.com/stevenwcarter/imgfind"
readme = "../README.md"

[dependencies]
# default-features = false drops imgfind's `tui` feature (which pulls
# ratatui-image → the system lib `chafa`); the launcher uses only the library.
imgfind = { path = "..", default-features = false }
slint = "1.16"
rfd = "0.15"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.16"

# Windows-only: embed the app icon into the .exe resources (see build.rs).
# Host-gated — included only when building on a Windows host (our Windows
# artifacts are built natively in CI); a non-Windows host skips it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# cargo-packager metadata (v0.11.x schema)
# Run with: cargo packager --release --formats dmg   (macOS CI)
#           cargo packager --release --formats wix   (Windows CI)
# All three binaries land in the same install directory so that
# imgfind::resolve_sibling_binary finds imgfind-gui and imgfind beside the
# launcher at runtime.
# ---------------------------------------------------------------------------
[package.metadata.packager]
product-name = "imgfind"
identifier = "plus.javapl.imgfind"
description = "CLIP-based semantic image search"
authors = ["Steven Carter"]
# Prebuilt platform icons: .icns for macOS (cargo-packager's PNG->icns
# generation fails with "No matching IconType") and a real multi-size .ico for
# Windows (so the MSI shortcut / Add-Remove-Programs entry uses a crisp icon).
# The .png is kept as a fallback. NOTE: the .ico here only covers installer
# chrome — the app icon the user sees on the running .exe is embedded into the
# binary by build.rs (winresource), since cargo-packager bundles the prebuilt
# exe as-is and can't add an exe resource.
icons = ["../packaging/icon.icns", "../packaging/icon.ico", "../packaging/icon.png"]

# Main binary is the launcher; GUI and CLI ride alongside it as siblings.
# `path` values are bare binary names (no extension); cargo-packager resolves
# them from the release build output directory.
binaries = [
    { path = "imgfind-launcher", main = true },
    { path = "imgfind-gui" },
    { path = "imgfind" },
]

[package.metadata.packager.macos]
minimum-system-version = "10.15"

# WiX (MSI) config for Windows.
# fragment_paths injects a WXS component that appends [INSTALLDIR] to the
# system PATH, making `imgfind` and `imgfind-gui` callable from any shell.
# cargo-packager has no built-in append-to-path flag; a custom WXS fragment
# is the documented mechanism (wix.fragment_paths → Vec<PathBuf>).
[package.metadata.packager.wix]
fragment-paths = ["../packaging/wix-path-env.wxs"]
component-group-refs = ["SetPathEnvGroup"]
