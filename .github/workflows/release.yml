name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: imgfind

      - name: Checkout clipper (public sibling)
        uses: actions/checkout@v4
        with:
          repository: stevenwcarter/clipper-rs
          path: clipper

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: imgfind

      # Linux GUI build deps (Slint).
      - name: Install Linux deps
        if: matrix.artifact == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libxcb1-dev

      - name: Install cargo-packager
        if: matrix.artifact != 'linux'
        run: cargo install cargo-packager --version "0.11.8" --locked

      # macOS: universal2 via two targets + lipo, then package.
      - name: Build + package (macOS)
        if: matrix.artifact == 'macos'
        working-directory: imgfind
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          # --no-default-features drops imgfind's `tui` feature, whose
          # ratatui-image dep needs the system lib `chafa` (pkg-config) that
          # isn't present on the runners. The installers ship the GUI + CLI;
          # the terminal TUI is not part of the packaged build.
          cargo build --release --no-default-features --target x86_64-apple-darwin -p imgfind-launcher -p imgfind-gui -p imgfind
          cargo build --release --no-default-features --target aarch64-apple-darwin -p imgfind-launcher -p imgfind-gui -p imgfind
          mkdir -p target/release
          for b in imgfind-launcher imgfind-gui imgfind; do
            lipo -create -output target/release/$b \
              target/x86_64-apple-darwin/release/$b \
              target/aarch64-apple-darwin/release/$b
          done
          cargo packager --release --formats dmg -p imgfind-launcher

      - name: Build + package (Windows)
        if: matrix.artifact == 'windows'
        working-directory: imgfind
        shell: bash
        run: |
          cargo build --release --no-default-features -p imgfind-launcher -p imgfind-gui -p imgfind
          cargo packager --release --formats wix -p imgfind-launcher

      - name: Build + tarball (Linux)
        if: matrix.artifact == 'linux'
        working-directory: imgfind
        run: |
          cargo build --release --no-default-features -p imgfind-launcher -p imgfind-gui -p imgfind
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          STAGE=imgfind-${SAFE_REF}-linux-x86_64
          mkdir -p "$STAGE/packaging"
          cp target/release/imgfind target/release/imgfind-gui target/release/imgfind-launcher "$STAGE/"
          cp install.sh "$STAGE/"
          cp packaging/imgfind-launcher.desktop "$STAGE/packaging/"
          # Ship the app icon so install.sh can place it for the .desktop entry.
          cp packaging/icon.png "$STAGE/packaging/"
          cp README.md USAGE.md "$STAGE/" 2>/dev/null || true
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Collect artifacts
        working-directory: imgfind
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          mkdir -p ../dist
          # dmg/msi land under target/<something>; find and rename.
          find target -maxdepth 4 -name '*.dmg' -exec cp {} "../dist/imgfind-${SAFE_REF}-macos-universal.dmg" \; 2>/dev/null || true
          find target -maxdepth 4 -name '*.msi' -exec cp {} "../dist/imgfind-${SAFE_REF}-windows-x86_64.msi" \; 2>/dev/null || true
          cp imgfind-*-linux-x86_64.tar.gz ../dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: imgfind-${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for git-cliff

      - name: Generate release notes (this tag's changelog section)
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.git-cliff.outputs.content }}
