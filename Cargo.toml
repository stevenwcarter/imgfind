[workspace]
members = [".", "imgfind-gui"]
resolver = "2"

[package]
name = "imgfind"
version = "0.1.0"
edition = "2024"

[profile.release]
#codegen-units = 1
opt-level = 3
#lto = true

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.ratatui-image]
opt-level = 3

[features]
default = ["tui"]
tui = ["crossterm", "futures", "ratatui", "ratatui-image", "tui-input"]
ratatui-image = ["dep:ratatui-image"]

[dependencies]
clipper = { version = "0.1.0", path = "../clipper" }
oshash = "0.3.1"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
diesel = { version = "2.0", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
diesel_migrations = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = "0.8"
walkdir = "2.0"
image = "0.25"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
regex = "1.10"
dirs = "6.0"
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "tracing"] }
log = "0.4"
indicatif = "0.18"
tracing-subscriber = "0.3.19"
axum = { version = "0.8.4", features = ["http2", "macros"] }
juniper = { version = "0.17", features = ["anyhow"] }
juniper_axum = "0.3.0"
serde_json = "1.0.140"
tower-http = { version = "0.6.6", features = [
    "compression-gzip",
    "compression-zstd",
    "compression-deflate",
    "full",
] }
tower = { version = "0.5.2", features = ["full", "tokio"] }
tracing = "0.1.41"
axum-extra = "0.12"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
rayon = "1.10.0"
iterm2img = "0.1.0"
r2d2_sqlite = "0.31.0"
r2d2 = "0.8.10"
base64 = "0.22.1"

crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
futures = { version = "0.3.31", optional = true }
ratatui = { version = "0.30.1", optional = true }
ratatui-image = { version = "11.0.4", features = ["tokio"], optional = true }
tui-input = { version = "0.15.3", optional = true }
dotenvy = "0.15.7"
tracing-appender = "0.2.3"
kamadak-exif = "0.6.1"
hashbrown = "0.16.0"
