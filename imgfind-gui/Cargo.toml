[package]
name = "imgfind-gui"
version = "0.2.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native Slint desktop GUI for imgfind, the CLIP-based semantic image search tool."
repository = "https://github.com/stevenwcarter/imgfind"
readme = "../README.md"

[dependencies]
# default-features = false drops imgfind's `tui` feature (which pulls
# ratatui-image → the system lib `chafa`); the GUI uses only the library.
imgfind = { path = "..", default-features = false }
clipper = { version = "0.1.0", path = "../../clipper" }
slint = "1.16"
image = "0.25"
open = "5"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru = "0.18"
parking_lot = "0.12"

[build-dependencies]
slint-build = "1.16"

# Windows-only: embed the app icon into the .exe resources (see build.rs).
# Host-gated — included only when building on a Windows host (our Windows
# artifacts are built natively in CI); a non-Windows host skips it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
